name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The MCP stdio probe exercises real Project queries, so CI needs the
      # same local SQLite schema created by the documented quick-start flow.
      - run: pnpm db:push
      # The Vite build generates the gitignored Paraglide and TanStack Router
      # artifacts that TypeScript needs in a clean checkout.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm i18n:check
      - if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: pnpm test:e2e
      - run: pnpm audit --prod --audit-level high
